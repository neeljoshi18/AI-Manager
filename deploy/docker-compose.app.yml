# AI Manager — multi-service application stack (M5)
# Embedded-mode services for staging demos; optional TLS reverse proxy.
#
# From monorepo root:
#   # App services only (fastest path to product UI):
#   docker compose -f deploy/docker-compose.app.yml up -d --build
#
#   # With Caddy HTTPS (set DOMAIN + optional email):
#   DOMAIN=status.example.com docker compose -f deploy/docker-compose.app.yml --profile tls up -d --build
#
#   # Infra + apps (production-ish URLs; apps still embedded by default):
#   docker compose -f deploy/docker-compose.platform.yml -f deploy/docker-compose.app.yml up -d --build
#
# Product UI:  http://127.0.0.1:18083/app/
# Lab:         http://127.0.0.1:18083/demo/
# Webhooks:    http://HOST:18080/v1/tenants/{tenant}/webhooks/github
#
# Secrets: mount vertical-security/secrets/dev_secrets.json (gitignored). Never put
# SLACK_BOT_TOKEN on twin-api (ADR-012).

name: ai-manager

services:
  egress:
    build:
      context: ../vertical-security
      dockerfile: ../deploy/Dockerfile.egress
    image: ai-manager-egress:local
    ports:
      - "18090:18090"
    environment:
      EGRESS_BIND: "0.0.0.0:18090"
      TOOL_REGISTRY: /app/config/tool_registry.yaml
      SECRETS_FILE: /app/secrets/dev_secrets.json
    volumes:
      # Host secrets (required for real Slack). Create from example if missing.
      - ../vertical-security/secrets:/app/secrets:ro
      - ../vertical-security/config:/app/config:ro
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:18090/healthz"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  v1:
    build:
      context: ../vertical-1
      dockerfile: ../deploy/Dockerfile.v1-ingestion
    image: ai-manager-v1:local
    ports:
      - "18080:18080"
    labels:
      autoheal: "true"
    environment:
      HTTP_BIND: "0.0.0.0:18080"
      RUNTIME_MODE: embedded
      # HMAC verify GitHub App webhooks via SECRETS_FILE WEBHOOK_SECRET_ten_github
      SKIP_AUTH: "false"
      SECRETS_FILE: /secrets/dev_secrets.json
      EGRESS_PROXY_URL: http://egress:18090
      # Survive restarts: event journal on disk (bridge re-projects into V2)
      V1_EMBEDDED_STATE_PATH: ${V1_EMBEDDED_STATE_PATH:-/var/lib/ai-manager/v1_events.json}
    volumes:
      - ../vertical-security/secrets:/secrets:ro
      - v1_state:/var/lib/ai-manager
    depends_on:
      - egress
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:18080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 15s
    restart: unless-stopped

  v2:
    build:
      context: ../vertical-2
      dockerfile: ../deploy/Dockerfile.v2-graph-api
    image: ai-manager-v2:local
    ports:
      - "18082:18082"
    environment:
      HTTP_BIND: "0.0.0.0:18082"
      RUNTIME_MODE: embedded
      # Keep /healthz responsive under bridge load (small VPS).
      GRAPH_PROJECT_CONCURRENCY: ${GRAPH_PROJECT_CONCURRENCY:-2}
      GRAPH_PROJECT_TIMEOUT_SECS: ${GRAPH_PROJECT_TIMEOUT_SECS:-10}
      # Survive restarts: graph nodes/edges + membership on disk (no mystery empty map)
      GRAPH_EMBEDDED_STATE_PATH: ${GRAPH_EMBEDDED_STATE_PATH:-/var/lib/ai-manager/v2_graph.json}
      GRAPH_MEMBERSHIP_STATE_PATH: ${GRAPH_MEMBERSHIP_STATE_PATH:-/var/lib/ai-manager/v2_membership.json}
    volumes:
      - v2_state:/var/lib/ai-manager
    labels:
      # willfarrell/autoheal restarts unhealthy containers
      autoheal: "true"
    healthcheck:
      test: ["CMD", "curl", "-sf", "--max-time", "2", "http://127.0.0.1:18082/healthz"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 15s
    restart: unless-stopped

  twin-api:
    build:
      context: ../vertical-3
      dockerfile: ../deploy/Dockerfile.twin-api
    image: ai-manager-twin-api:local
    ports:
      - "18083:18083"
    # OAuth client id/secret from deploy/.env.staging (gitignored). Never put SLACK_BOT_TOKEN in env.
    # OAUTH_VAULT_PATH: Slack OAuth callback writes SLACK_BOT_TOKEN for egress (restart egress after).
    env_file:
      - path: .env.staging
        required: false
    environment:
      BIND_ADDR: "0.0.0.0:18083"
      RUNTIME_MODE: embedded
      SHADOW_MODE_DAYS: ${SHADOW_MODE_DAYS:-0}
      V1_BASE_URL: http://v1:18080
      V2_BASE_URL: http://v2:18082
      EGRESS_PROXY_URL: http://egress:18090
      EGRESS_ENFORCE: "true"
      USE_EGRESS_SLACK: "true"
      # Chat delivery adapter: slack (default) | teams. Slack path unchanged unless teams selected.
      DELIVERY_ADAPTER: ${DELIVERY_ADAPTER:-slack}
      USE_EGRESS_TEAMS: ${USE_EGRESS_TEAMS:-false}
      # Optional Neon (or any Postgres) for live event SQL — see plans/observe-neon.md
      OBSERVE_DATABASE_URL: ${OBSERVE_DATABASE_URL:-}
      DATABASE_URL: ${DATABASE_URL:-}
      TEAMS_APP_ID: ${TEAMS_APP_ID:-}
      TEAMS_TENANT_ID: ${TEAMS_TENANT_ID:-}
      TEAMS_SERVICE_URL: ${TEAMS_SERVICE_URL:-}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-}
      SLACK_CLIENT_ID: ${SLACK_CLIENT_ID:-}
      SLACK_CLIENT_SECRET: ${SLACK_CLIENT_SECRET:-}
      SLACK_SIGNING_SECRET: ${SLACK_SIGNING_SECRET:-}
      SLACK_REDIRECT_URI: ${SLACK_REDIRECT_URI:-}
      GITHUB_APP_ID: ${GITHUB_APP_ID:-}
      GITHUB_APP_CLIENT_ID: ${GITHUB_APP_CLIENT_ID:-}
      GITHUB_APP_SLUG: ${GITHUB_APP_SLUG:-}
      GITHUB_INSTALLATION_ID: ${GITHUB_INSTALLATION_ID:-}
      OAUTH_VAULT_PATH: ${OAUTH_VAULT_PATH:-/secrets/dev_secrets.json}
      DEFAULT_TENANT_ID: ${DEFAULT_TENANT_ID:-ten_github}
      # 24h lookback — pilot standup replacement (sparse commit days still get digests)
      STATUS_WINDOW_SECS: ${STATUS_WINDOW_SECS:-86400}
      NOTIFY_INTERVAL_SECS: ${NOTIFY_INTERVAL_SECS:-1800}
      COMPILE_INTERVAL_SECS: ${COMPILE_INTERVAL_SECS:-1800}
      NOTIFY_ON_COMPILE: ${NOTIFY_ON_COMPILE:-false}
      APP_STATIC_DIR: /app/app-static
      DEMO_STATIC_DIR: /app/demo-static
      # Survive twin-api restarts (embedded): team map + digests on disk (A2/A3).
      TWIN_EMBEDDED_STATE_PATH: ${TWIN_EMBEDDED_STATE_PATH:-/var/lib/ai-manager/twin_state.json}
      TWIN_PERSIST_INTERVAL_SECS: ${TWIN_PERSIST_INTERVAL_SECS:-30}
      # Same keys as bridge — seed multi-person maps on cold start
      SLACK_USER_MAP: ${SLACK_USER_MAP:-222674398:U0APK7W1X99,neeljoshi18:U0APK7W1X99,309182469:U0BLN0N7VB5,paneerjeera:U0BLN0N7VB5}
      SEED_TEAM_TENANT: ${DEFAULT_TENANT_ID:-ten_github}
      SEED_TEAM_CHANNEL: ${SLACK_TEST_CHANNEL_ID:-C0APN754MQV}
    volumes:
      - twin_state:/var/lib/ai-manager
      # RW so Slack OAuth callback can upsert SLACK_BOT_TOKEN (egress still reads same file)
      - ../vertical-security/secrets:/secrets
    depends_on:
      - v1
      - v2
      - egress
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:18083/healthz"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  # V1 → V2 projection + person twin registration (never Slack-DMs; twin scheduler does).
  bridge:
    build:
      context: ../scripts
      dockerfile: ../deploy/Dockerfile.bridge
    image: ai-manager-bridge:local
    env_file:
      - path: .env.staging
        required: false
    environment:
      V1_BASE_URL: http://v1:18080
      V2_BASE_URL: http://v2:18082
      TWIN_BASE_URL: http://twin-api:18083
      TENANT_ID: ${DEFAULT_TENANT_ID:-ten_github}
      STATE_FILE: /var/lib/ai-manager/bridge_seen.txt
      POLL_SECS: ${BRIDGE_POLL_SECS:-5}
      BRIDGE_MAX_PER_TICK: ${BRIDGE_MAX_PER_TICK:-3}
      BRIDGE_RECOVERY_MAX_PER_TICK: ${BRIDGE_RECOVERY_MAX_PER_TICK:-12}
      BRIDGE_RECOVERY_POLL_SECS: ${BRIDGE_RECOVERY_POLL_SECS:-1.0}
      BRIDGE_RECOVERY_EVENT_LIMIT: ${BRIDGE_RECOVERY_EVENT_LIMIT:-250}
      BRIDGE_RECOVERY_PROJECT_PAUSE_SECS: ${BRIDGE_RECOVERY_PROJECT_PAUSE_SECS:-0.05}
      BRIDGE_PROJECT_PAUSE_SECS: ${BRIDGE_PROJECT_PAUSE_SECS:-0.4}
      BRIDGE_PROJECT_TIMEOUT_SECS: ${BRIDGE_PROJECT_TIMEOUT_SECS:-12}
      BRIDGE_MAX_EVENT_FAILURES: ${BRIDGE_MAX_EVENT_FAILURES:-5}
      BRIDGE_EMPTY_GRAPH_CHECK_SECS: ${BRIDGE_EMPTY_GRAPH_CHECK_SECS:-45}
      SLACK_TEST_USER_ID: ${SLACK_TEST_USER_ID:-U0APK7W1X99}
      SLACK_TEST_CHANNEL_ID: ${SLACK_TEST_CHANNEL_ID:-C0APN754MQV}
      DEFAULT_DISPLAY_NAME: ${DEFAULT_DISPLAY_NAME:-Neel}
      # GitHub provider user id / login → Slack user id (comma-separated)
      # Person 1: neeljoshi18 · Person 2: paneerjeera (A2 multi-person). Team UI overlays too.
      SLACK_USER_MAP: ${SLACK_USER_MAP:-222674398:U0APK7W1X99,neeljoshi18:U0APK7W1X99,309182469:U0BLN0N7VB5,paneerjeera:U0BLN0N7VB5}
      # Data currency: poll GitHub so CLI/Actions/UI commits map even if webhooks drop
      # Prefer long-lived PAT: set GITHUB_PAT or GITHUB_TOKEN in deploy/.env.staging
      GITHUB_PAT: ${GITHUB_PAT:-${BRIDGE_GITHUB_TOKEN:-}}
      BRIDGE_GITHUB_TOKEN: ${BRIDGE_GITHUB_TOKEN:-${GITHUB_PAT:-}}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-${GITHUB_PAT:-${GH_TOKEN:-}}}
      GITHUB_REPOS: ${GITHUB_REPOS:-neeljoshi18/AI-Manager}
      COMMIT_POLL_SECS: ${COMMIT_POLL_SECS:-90}
      COMMIT_POLL_PAGES: ${COMMIT_POLL_PAGES:-5}
      COMMIT_BOOT_PAGES: ${COMMIT_BOOT_PAGES:-15}
      COMMIT_BOOT_CAP: ${COMMIT_BOOT_CAP:-80}
      COMMIT_TICK_CAP: ${COMMIT_TICK_CAP:-24}
      COMMIT_SEEN_FILE: /var/lib/ai-manager/bridge_commits_seen.txt
    volumes:
      - bridge_state:/var/lib/ai-manager
    depends_on:
      - v1
      - v2
      - twin-api
    restart: unless-stopped

  # Restart any container labeled autoheal=true when Docker marks it unhealthy.
  # Fixes permanent empty Graph after V2 hangs on small staging VPS.
  autoheal:
    image: willfarrell/autoheal:latest
    restart: unless-stopped
    environment:
      AUTOHEAL_CONTAINER_LABEL: autoheal
      AUTOHEAL_INTERVAL: "10"
      AUTOHEAL_START_PERIOD: "30"
      AUTOHEAL_DEFAULT_STOP_TIMEOUT: "10"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      - v2

  # Optional TLS edge (profile: tls). Needs DOMAIN env.
  # Exposes 80/443; proxies product UI + webhooks.
  caddy:
    profiles: ["tls"]
    image: caddy:2.8-alpine
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - twin-api
      - v1
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
  bridge_state:
  twin_state:
  v1_state:
  v2_state:
