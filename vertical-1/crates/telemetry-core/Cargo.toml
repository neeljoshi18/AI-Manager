[package]
name = "telemetry-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
telemetry-proto = { workspace = true }
tokio = { workspace = true }
futures = { workspace = true }
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = "0.9"
bytes = { workspace = true }
hmac = { workspace = true }
sha2 = { workspace = true }
subtle = { workspace = true }
hex = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
dashmap = { workspace = true }
parking_lot = { workspace = true }
tracing = { workspace = true }
base64 = { workspace = true }
prost = { workspace = true }
reqwest = { workspace = true }

# Optional production backends
redis = { workspace = true, optional = true }
rskafka = { workspace = true, optional = true }
sqlx = { workspace = true, optional = true }
clickhouse = { workspace = true, optional = true }
aws-sdk-s3 = { workspace = true, optional = true }
aws-config = { workspace = true, optional = true }
aws-credential-types = { workspace = true, optional = true }
aws-types = { workspace = true, optional = true }

[features]
default = ["embedded"]
embedded = []
# Full production backends against Redis / Redpanda / Cockroach / ClickHouse / MinIO
production = [
    "dep:redis",
    "dep:rskafka",
    "dep:sqlx",
    "dep:clickhouse",
    "dep:aws-sdk-s3",
    "dep:aws-config",
    "dep:aws-credential-types",
    "dep:aws-types",
]

[dev-dependencies]
tokio = { workspace = true, features = ["test-util", "macros"] }
