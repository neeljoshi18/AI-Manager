# Deploy staging from GitHub's network (not campus Wi‑Fi).
#
# Campus Wi‑Fi often blocks outbound SSH (port 22) to the droplet. This workflow
# runs on GitHub-hosted runners, which can still reach the VPS. You only need
# `git push` over HTTPS from college Wi‑Fi.
#
# One-time setup (hotspot once is fine):
#   1. GitHub repo → Settings → Secrets and variables → Actions
#   2. Add:
#        STAGING_HOST          = 206.189.129.31
#        STAGING_USER          = neel
#        STAGING_SSH_KEY       = full private key (ed25519) that can log in as neel
#   3. On the droplet (once): ensure ~/.ssh/authorized_keys has the matching public key
#   4. DO firewall: allow inbound TCP 22 from 0.0.0.0/0 (or at least GitHub Actions IPs)
#
# Trigger: push to main, or Actions → Deploy staging → Run workflow
name: Deploy staging

on:
  push:
    branches: [main]
    paths-ignore:
      - "plans/**"
      - "starting-out-documents/**"
      - "**/*.md"
      - ".gitignore"
  workflow_dispatch:
    inputs:
      skip_build:
        description: "Skip image rebuild (pull-only compose up)"
        type: boolean
        default: false
      recover_only:
        description: "Recover mode: restart V2/egress/bridge (no full multi-service rebuild)"
        type: boolean
        default: false

concurrency:
  group: staging-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Start SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.STAGING_SSH_KEY }}

      - name: Known hosts
        env:
          STAGING_HOST: ${{ secrets.STAGING_HOST }}
        run: |
          set -euo pipefail
          HOST="${STAGING_HOST:-206.189.129.31}"
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          # accept-new on first connect; keyscan when possible
          ssh-keyscan -T 10 -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
          chmod 600 ~/.ssh/known_hosts || true

      - name: Rsync monorepo (keep host secrets)
        env:
          STAGING_HOST: ${{ secrets.STAGING_HOST }}
          STAGING_USER: ${{ secrets.STAGING_USER }}
        run: |
          set -euo pipefail
          HOST="${STAGING_USER:-neel}@${STAGING_HOST:-206.189.129.31}"
          # Do NOT ship secrets from CI — droplet already has vault + .env.staging
          rsync -az --delete \
            --exclude '**/target/' \
            --exclude '.git/' \
            --exclude 'ssh/' \
            --exclude '**/.DS_Store' \
            --exclude '**/node_modules/' \
            --exclude 'vertical-security/secrets/dev_secrets.json' \
            --exclude 'deploy/.env.staging' \
            -e "ssh -o BatchMode=yes -o StrictHostKeyChecking=accept-new" \
            ./ "${HOST}:~/ai-manager/"

      - name: Recover V2 + egress (fast path)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.recover_only == true }}
        env:
          STAGING_HOST: ${{ secrets.STAGING_HOST }}
          STAGING_USER: ${{ secrets.STAGING_USER }}
        run: |
          set -euo pipefail
          HOST="${STAGING_USER:-neel}@${STAGING_HOST:-206.189.129.31}"
          ssh -o BatchMode=yes -o StrictHostKeyChecking=accept-new "$HOST" bash -s <<'REMOTE'
          set -euo pipefail
          cd "$HOME/ai-manager"
          export DOCKER_BUILDKIT=1
          COMPOSE="docker compose -f deploy/docker-compose.app.yml --env-file deploy/.env.staging"
          $COMPOSE --profile tls up -d || $COMPOSE up -d
          echo "== rebuild twin-api (UI/API polish) =="
          $COMPOSE build twin-api
          $COMPOSE up -d --no-deps twin-api
          for s in v2 egress autoheal twin-api bridge; do
            echo "== restart $s =="
            $COMPOSE restart "$s" || true
          done
          sleep 6
          if ! curl -sf --max-time 3 http://127.0.0.1:18082/healthz >/dev/null; then
            echo "v2 force-recreate"
            $COMPOSE up -d --force-recreate --no-deps v2
            sleep 10
          fi
          if ! curl -sf --max-time 3 http://127.0.0.1:18090/healthz >/dev/null; then
            echo "egress force-recreate"
            $COMPOSE up -d --force-recreate --no-deps egress
            sleep 6
          fi
          $COMPOSE restart twin-api bridge || true
          sleep 4
          echo "== health =="
          curl -sf --max-time 5 http://127.0.0.1:18090/healthz && echo " egress ok" || echo " EGRESS DOWN"
          curl -sf --max-time 5 http://127.0.0.1:18082/healthz && echo " v2 ok" || echo " V2 DOWN"
          curl -sf --max-time 5 http://127.0.0.1:18080/healthz && echo " v1 ok" || echo " V1 DOWN"
          curl -sf --max-time 5 http://127.0.0.1:18083/healthz && echo " twin ok" || echo " TWIN DOWN"
          $COMPOSE --profile tls ps || true
          REMOTE

      - name: Compose up on droplet
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.recover_only == true) }}
        env:
          STAGING_HOST: ${{ secrets.STAGING_HOST }}
          STAGING_USER: ${{ secrets.STAGING_USER }}
          DOMAIN: status.neel.world
          SKIP_BUILD: ${{ github.event.inputs.skip_build || 'false' }}
          # Optional long-lived PAT for private-repo commit poller (data currency)
          BRIDGE_GITHUB_TOKEN: ${{ secrets.BRIDGE_GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          HOST="${STAGING_USER:-neel}@${STAGING_HOST:-206.189.129.31}"
          BUILD_FLAG="--build"
          if [ "${SKIP_BUILD}" = "true" ]; then
            BUILD_FLAG=""
          fi
          # Pass long-lived PAT into remote only if set (never echo value)
          if [ -n "${BRIDGE_GITHUB_TOKEN:-}" ]; then
            ssh -o BatchMode=yes -o StrictHostKeyChecking=accept-new "$HOST" bash -s <<TOKENEOF
          set -euo pipefail
          ENVF="\$HOME/ai-manager/deploy/.env.staging"
          touch "\$ENVF"
          for KEY in GITHUB_TOKEN GITHUB_PAT BRIDGE_GITHUB_TOKEN; do
            if grep -q "^\${KEY}=" "\$ENVF" 2>/dev/null; then
              sed -i.bak "s|^\${KEY}=.*|\${KEY}=${BRIDGE_GITHUB_TOKEN}|" "\$ENVF"
            else
              echo "\${KEY}=${BRIDGE_GITHUB_TOKEN}" >> "\$ENVF"
            fi
          done
          TOKENEOF
          fi
          ssh -o BatchMode=yes -o StrictHostKeyChecking=accept-new "$HOST" bash -s <<REMOTE
          set -euo pipefail
          cd "\$HOME/ai-manager"
          test -f vertical-security/secrets/dev_secrets.json
          test -f deploy/.env.staging
          export DOMAIN="${DOMAIN}"
          export COMPOSE_PARALLEL_LIMIT=1
          export DOCKER_BUILDKIT=1
          export COMPOSE_DOCKER_CLI_BUILD=1
          # VOLUMES ARE SACRED — never prune data volumes on staging
          if docker volume ls -q | grep -E 'ai-manager_(v1|v2|twin|bridge)_state' >/dev/null; then
            echo "sacred volumes present (will NOT prune)"
            docker volume ls | grep ai-manager || true
          else
            echo "warn: expected ai-manager_*_state volumes not all present yet"
          fi
          # Sequential builds (one service at a time) avoid cargo/registry races on 2vCPU
          if [ -n "${BUILD_FLAG}" ]; then
            for svc in egress v1 v2 twin-api bridge; do
              echo "== build \$svc =="
              docker compose -f deploy/docker-compose.app.yml --env-file deploy/.env.staging --profile tls build "\$svc"
            done
            # up without -V / --renew-anon-volumes — keep named volumes
            docker compose -f deploy/docker-compose.app.yml --env-file deploy/.env.staging --profile tls up -d
          else
            docker compose -f deploy/docker-compose.app.yml --env-file deploy/.env.staging --profile tls up -d
          fi
          docker compose -f deploy/docker-compose.app.yml --env-file deploy/.env.staging --profile tls ps
          curl -sf --max-time 8 http://127.0.0.1:18083/healthz || true
          echo
          # V1 sometimes hangs after recreate — restart until healthy (sales gate)
          for i in 1 2 3 4 5; do
            if curl -sf --max-time 4 http://127.0.0.1:18080/healthz >/dev/null; then
              echo "v1 healthy on try \$i"
              break
            fi
            echo "v1 unhealthy try \$i — restart"
            docker compose -f deploy/docker-compose.app.yml --env-file deploy/.env.staging restart v1 || true
            sleep 6
          done
          curl -sf --max-time 5 http://127.0.0.1:18080/healthz || echo "V1 STILL DOWN"
          echo
          docker compose -f deploy/docker-compose.app.yml --env-file deploy/.env.staging restart bridge || true
          sleep 3
          # If V1 still dead, recreate container (keeps volume)
          if ! curl -sf --max-time 4 http://127.0.0.1:18080/healthz >/dev/null; then
            echo "v1 recreate (preserve volumes)"
            docker compose -f deploy/docker-compose.app.yml --env-file deploy/.env.staging up -d --force-recreate --no-deps v1 || true
            sleep 8
            curl -sf --max-time 5 http://127.0.0.1:18080/healthz || echo "V1 STILL DOWN after recreate"
          fi
          echo
          # Prove volumes still hold graph state after recreate (data currency)
          docker run --rm -v ai-manager_v2_state:/d alpine ls -la /d || true
          docker run --rm -v ai-manager_v1_state:/d alpine ls -la /d || true
          docker run --rm -v ai-manager_bridge_state:/d alpine ls -la /d || true
          docker run --rm -v ai-manager_twin_state:/d alpine ls -la /d || true
          REMOTE

      - name: Public health + pilot smoke
        run: |
          set -euo pipefail
          sleep 15
          BASE=https://status.neel.world
          curl -sS --max-time 45 -o /dev/null -w "healthz http=%{http_code}\n" "$BASE/healthz"
          curl -sS --max-time 45 "$BASE/healthz" || true
          echo
          # Product post-deploy (idempotent)
          for path in \
            /v3/tenants/ten_github/team/prune \
            /v3/tenants/ten_github/graph/ensure_users \
            /v3/tenants/ten_github/seed/intent_demo \
            /v3/tenants/ten_github/seed/dual_digests
          do
            code=$(curl -sS --max-time 60 -o /tmp/smoke.json -w "%{http_code}" -X POST "$BASE$path" || echo fail)
            echo "POST $path → $code"
            head -c 400 /tmp/smoke.json 2>/dev/null || true
            echo
          done
          # Wait for bridge boot poller a bit, then compile dual digests
          sleep 25
          curl -sS --max-time 90 -X POST "$BASE/v3/tenants/ten_github/team/compile" \
            -H 'content-type: application/json' \
            -d '{"force_notify":false,"allow_notify":true}' | head -c 2000 || true
          echo
          curl -sS --max-time 30 "$BASE/v3/tenants/ten_github/pilot_readiness" | head -c 1500 || true
          echo
          # Data currency: Dev insights must show commit messages + heat
          curl -sS --max-time 30 "$BASE/v3/tenants/ten_github/insights/dev" | head -c 2000 || true
          echo
          curl -sS --max-time 30 "$BASE/v3/tenants/ten_github/graph?node_limit=30" | head -c 1000 || true
          echo
