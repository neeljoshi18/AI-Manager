[workspace]
resolver = "2"
members = [
    "crates/twin-core",
    "crates/twin-compiler",
    "crates/twin-delivery",
    "crates/twin-api",
    "crates/twin-verify",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Proprietary"
authors = ["AI Manager Platform"]

[workspace.dependencies]
tokio = { version = "1.43", features = ["full"] }
async-trait = "0.1"
axum = { version = "0.8", features = ["macros"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["trace", "cors", "fs"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2.0"
anyhow = "1.0"
uuid = { version = "1.11", features = ["v4", "serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dashmap = "6.1"
parking_lot = "0.12"
sha2 = "0.10"
hex = "0.4"
dotenvy = "0.15"
clap = { version = "4.5", features = ["derive", "env"] }
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "uuid", "chrono", "json"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

twin-core = { path = "crates/twin-core" }
twin-compiler = { path = "crates/twin-compiler" }
twin-delivery = { path = "crates/twin-delivery" }

[profile.release]
lto = "thin"
codegen-units = 1
