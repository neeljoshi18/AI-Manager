[workspace]
resolver = "2"
members = [
    "crates/telemetry-proto",
    "crates/telemetry-core",
    "crates/telemetry-ingestion",
    "crates/telemetry-consumer",
    "crates/telemetry-query",
    "crates/telemetry-verify",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Proprietary"
authors = ["AI Manager Platform"]

[workspace.dependencies]
# Async runtime
tokio = { version = "1.43", features = ["full"] }
futures = "0.3"
async-trait = "0.1"

# HTTP
axum = { version = "0.8", features = ["macros"] }
tower = { version = "0.5", features = ["limit", "util"] }
tower-http = { version = "0.6", features = ["trace", "cors", "limit", "timeout", "request-id"] }
hyper = "1.5"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
prost = "0.13"
prost-types = "0.13"
bytes = "1.9"

# Crypto / security
hmac = "0.12"
sha2 = "0.10"
subtle = "2.6"
hex = "0.4"
uuid = { version = "1.11", features = ["v4", "serde"] }
constant_time_eq = "0.3"

# Storage / messaging
redis = { version = "0.27", features = ["tokio-comp", "connection-manager"] }
# Pure-Rust Kafka client (no librdkafka/cmake). Works with Redpanda.
rskafka = { version = "0.5", default-features = true }
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "uuid", "chrono", "json"] }
clickhouse = { version = "0.13", features = ["time", "uuid", "inserter", "chrono"] }
aws-sdk-s3 = "1.65"
aws-config = "1.5"
aws-credential-types = "1.2"
aws-types = "1.3"

# Observability
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
metrics = "0.24"
metrics-exporter-prometheus = "0.16"

# Time / errors / utils
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2.0"
anyhow = "1.0"
dashmap = "6.1"
parking_lot = "0.12"
once_cell = "1.20"
base64 = "0.22"
url = "2.5"
dotenvy = "0.15"
clap = { version = "4.5", features = ["derive", "env"] }

# Internal crates
telemetry-proto = { path = "crates/telemetry-proto" }
telemetry-core = { path = "crates/telemetry-core" }

[profile.release]
lto = "thin"
codegen-units = 1
opt-level = 3
